<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Data flow from a TV definition to a live Treeview and its exports" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d1e2b"/></marker></defs><rect width="900" height="300" fill="#fffaf1"/><g font-family="Segoe UI,system-ui,sans-serif" fill="#172733"><rect x="20" y="30" width="170" height="70" rx="6" fill="#fff3d6" stroke="#d7a555" stroke-width="1.5"/><text x="105.0" y="62.0" text-anchor="middle" font-size="16" font-weight="700" fill="#172733">TV_NAME</text><text x="105.0" y="80.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">title, columns, labels, widths, ...</text><rect x="230" y="30" width="190" height="70" rx="6" fill="#317f83" stroke="#317f83" stroke-width="1.5"/><text x="325.0" y="62.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">build_treeview()</text><text x="325.0" y="80.0" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".85">sort, stripes, tooltip, scroll</text><rect x="460" y="30" width="170" height="70" rx="6" fill="#0d1e2b" stroke="#0d1e2b" stroke-width="1.5"/><text x="545.0" y="62.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff3d6">live Treeview</text><text x="545.0" y="80.0" text-anchor="middle" font-size="11.5" fill="#fff3d6" opacity=".85">the single source</text><line x1="190" y1="65" x2="228" y2="65" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><line x1="420" y1="65" x2="458" y2="65" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><rect x="20" y="170" width="170" height="56" rx="6" fill="#fff" stroke="#d8cbb8" stroke-width="1.5"/><text x="105.0" y="195.0" text-anchor="middle" font-size="13" font-weight="700" fill="#172733">your rows</text><text x="105.0" y="213.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">insert_row(tv, values)</text><line x1="105" y1="170" x2="105" y2="102" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="230" y="170" width="190" height="56" rx="6" fill="#fff" stroke="#d8cbb8" stroke-width="1.5"/><text x="325.0" y="195.0" text-anchor="middle" font-size="13" font-weight="700" fill="#172733">theme palette</text><text x="325.0" y="213.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">evenrow / oddrow colours</text><line x1="325" y1="170" x2="325" y2="102" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="700" y="14" width="170" height="44" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="785.0" y="33.0" text-anchor="middle" font-size="13" font-weight="700" fill="#172733">CSV</text><text x="785.0" y="51.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">opens</text><line x1="632" y1="65" x2="698" y2="36" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><rect x="700" y="68" width="170" height="44" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="785.0" y="87.0" text-anchor="middle" font-size="13" font-weight="700" fill="#172733">TSV</text><text x="785.0" y="105.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">writes</text><line x1="632" y1="65" x2="698" y2="90" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><rect x="700" y="122" width="170" height="44" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="785.0" y="141.0" text-anchor="middle" font-size="13" font-weight="700" fill="#172733">JSON</text><text x="785.0" y="159.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">writes</text><line x1="632" y1="65" x2="698" y2="144" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><rect x="700" y="176" width="170" height="44" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="785.0" y="195.0" text-anchor="middle" font-si