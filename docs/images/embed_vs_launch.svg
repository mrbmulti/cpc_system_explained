<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" role="img" aria-label="Choosing between embedding an app as a tab and launching it as a process" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d1e2b"/></marker></defs><rect width="900" height="472" fill="#fffaf1"/><g font-family="Segoe UI,system-ui,sans-serif" fill="#172733"><rect x="30" y="20" width="380" height="52" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="220.0" y="51.0" text-anchor="middle" font-size="15" font-weight="700" fill="#172733">TIER 1  -  EMBED</text><rect x="490" y="20" width="380" height="52" rx="6" fill="#d7a555" stroke="#b9935b" stroke-width="1.5"/><text x="680.0" y="51.0" text-anchor="middle" font-size="15" font-weight="700" fill="#172733">TIER 2  -  LAUNCH</text><rect x="30" y="92" width="380" height="74" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="220.0" y="126.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">attach(parent, context)</text><text x="220.0" y="144.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">app becomes a tab in the host window</text><rect x="490" y="92" width="380" height="74" rx="6" fill="#fff" stroke="#b9935b" stroke-width="1.5"/><text x="680.0" y="126.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">subprocess.Popen([python, app.py])</text><text x="680.0" y="144.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">app keeps its own window</text><rect x="30" y="186" width="380" height="150" rx="6" fill="#fff" stroke="#d8cbb8" stroke-width="1.5"/><text x="220.0" y="266.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733"></text><text x="48" y="214" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">+ Shares theme, density, status strip</text><text x="48" y="240" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">+ Shares one config and one Notes tab</text><text x="48" y="266" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">+ Fast: no second Python start</text><text x="48" y="292" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">! Risk: a bug or a blocking call</text><text x="48" y="318" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">   freezes the whole host</text><rect x="490" y="186" width="380" height="150" rx="6" fill="#fff" stroke="#d8cbb8" stroke-width="1.5"/><text x="680.0" y="266.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733"></text><text x="508" y="214" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">+ Crash or hang cannot hurt the host</text><text x="508" y="240" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">+ Any language, any Tk version</text><text x="508" y="266" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">  Own window, own look unless it</text><text x="508" y="292" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">  reads the shared settings itself</text><text x="508" y="318" font-size="12.5" fill="#172733" text-anchor="start" font-weight="400">- Cost: no shared tab, no live theme</text><rect x="235" y="364" width="430" height="64" rx="6" fill="#fff3d6" stroke="#d7a555" stroke-width="1.5"/><text x="450.0" y="393.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">Which tier?  Ask three questions</text><text x="450.0" y="411.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">Is it stable?  Is it small?  Does it need the shared theme?</text><text x="450" y="452" font-size="13" fill="#0d1e2b" text-anchor="middle" font-weight="700">Three yes answers: embed.  Any no: launch it from a Gateway card.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>