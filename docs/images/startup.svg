<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" role="img" aria-label="Seven-step startup order of the host window" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d1e2b"/></marker></defs><rect width="900" height="528" fill="#fffaf1"/><g font-family="Segoe UI,system-ui,sans-serif" fill="#172733"><circle cx="46" cy="45" r="19" fill="#0d1e2b"/><text x="46" y="51" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">1</text><rect x="84" y="18" width="520" height="54" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="344.0" y="42.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">Read settings JSON</text><text x="344.0" y="60.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">beside the program; defaults fill gaps</text><line x1="46" y1="64" x2="46" y2="88" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><circle cx="46" cy="117" r="19" fill="#0d1e2b"/><text x="46" y="123" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">2</text><rect x="84" y="90" width="520" height="54" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="344.0" y="114.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">Create root, hide it</text><text x="344.0" y="132.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">TkinterDnD if present; root.withdraw()</text><line x1="46" y1="136" x2="46" y2="160" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><circle cx="46" cy="189" r="19" fill="#0d1e2b"/><text x="46" y="195" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">3</text><rect x="84" y="162" width="520" height="54" rx="6" fill="#fff3d6" stroke="#d7a555" stroke-width="1.5"/><text x="344.0" y="186.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">apply_theme(root, name, density)</text><text x="344.0" y="204.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">before any widget is built</text><line x1="46" y1="208" x2="46" y2="232" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><circle cx="46" cy="261" r="19" fill="#0d1e2b"/><text x="46" y="267" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">4</text><rect x="84" y="234" width="520" height="54" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="344.0" y="258.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">Create notebook + status line</text><text x="344.0" y="276.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">the one shared strip</text><line x1="46" y1="280" x2="46" y2="304" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><circle cx="46" cy="333" r="19" fill="#0d1e2b"/><text x="46" y="339" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">5</text><rect x="84" y="306" width="520" height="54" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="344.0" y="330.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">Add tabs, each in try/except</text><text x="344.0" y="348.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">a broken tab shows a notice, not a crash</text><line x1="46" y1="352" x2="46" y2="376" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><circle cx="46" cy="405" r="19" fill="#0d1e2b"/><text x="46" y="411" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">6</text><rect x="84" y="378" width="520" height="54" rx="6" fill="#fff3d6" stroke="#d7a555" stroke-width="1.5"/><text x="344.0" y="402.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">cpc_notes.attach(notebook ...)</text><text x="344.0" y="420.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">last: reads the live tabs, inserts Notes first</text><line x1="46" y1="424" x2="46" y2="448" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><circle cx="46" cy="477" r="19" fill="#0d1e2b"/><text x="46" y="483" font-size="15" fill="#fff3d6" text-anchor="middle" font-weight="700">7</text><rect x="84" y="450" width="520" height="54" rx="6" fill="#f4ebda" stroke="#d8cbb8" stroke-width="1.5"/><text x="344.0" y="474.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">Select last tab, show, mainloop</text><text x="344.0" y="492.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">on close: save settings</text><rect x="640" y="90" width="230" height="100" rx="6" fill="#0d1e2b" stroke="#0d1e2b" stroke-width="1.5"/><text x="755.0" y="137.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff3d6">Order is a contract</text><text x="755.0" y="155.0" text-anchor="middle" font-size="11.5" fill="#fff3d6" opacity=".85">theme first, or colours are wrong</text><rect x="640" y="306" width="230" height="110" rx="6" fill="#0d1e2b" stroke="#0d1e2b" stroke-width="1.5"/><text x="755.0" y="358.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff3d6">Notes goes last</text><text x="755.0" y="376.0" text-anchor="middle" font-size="11.5" fill="#fff3d6" opacity=".85">it needs every other tab to exist</text><line x1="640" y1="140" x2="606" y2="140" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><line x1="640" y1="360" x2="606" y2="360" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>