<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" role="img" aria-label="Layered architecture: host window, shared library, your applications" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d1e2b"/></marker></defs><rect width="900" height="456" fill="#fffaf1"/><g font-family="Segoe UI,system-ui,sans-serif" fill="#172733"><rect x="30" y="24" width="840" height="62" rx="6" fill="#0d1e2b" stroke="#0d1e2b" stroke-width="1.5"/><text x="450.0" y="60.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff3d6">HOST WINDOW  -  one Tk root, one ttk.Notebook, one settings JSON beside the program</text><rect x="30" y="118" width="98" height="44" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="79.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">Notes</text><rect x="136" y="118" width="98" height="44" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="185.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">Gateway</text><rect x="242" y="118" width="98" height="44" rx="6" fill="#d7a555" stroke="#317f83" stroke-width="1.5"/><text x="291.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">Your app A</text><rect x="348" y="118" width="98" height="44" rx="6" fill="#d7a555" stroke="#317f83" stroke-width="1.5"/><text x="397.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">Your app B</text><rect x="454" y="118" width="98" height="44" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="503.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">Config</text><rect x="560" y="118" width="98" height="44" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="609.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">UI Choices</text><rect x="666" y="118" width="98" height="44" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="715.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">About</text><rect x="772" y="118" width="98" height="44" rx="6" fill="#e3f0ef" stroke="#317f83" stroke-width="1.5"/><text x="821.0" y="145.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">Log</text><text x="30" y="184" font-size="12.5" fill="#52616a" text-anchor="start" font-weight="400" font-style="italic">Each tab is a ttk.Frame the host hands to a module. The host never knows what is inside it.</text><rect x="30" y="214" width="840" height="26" rx="6" fill="#317f83" stroke="#317f83" stroke-width="1.5"/><text x="450.0" y="232.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SHARED LIBRARY  -  behaviour written once</text><rect x="30" y="250" width="134" height="58" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="97.0" y="276.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">ui_theme</text><text x="97.0" y="294.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">apply_theme, density</text><rect x="171.2" y="250" width="134" height="58" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="238.2" y="276.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">cpc_ui_choices</text><text x="238.2" y="294.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">theme panel + About</text><rect x="312.4" y="250" width="134" height="58" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="379.4" y="276.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">cpc_notes</text><text x="379.4" y="294.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">Notes from live tabs</text><rect x="453.59999999999997" y="250" width="134" height="58" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="520.5999999999999" y="276.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">cpc_treeviews</text><text x="520.5999999999999" y="294.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">tables + exports</text><rect x="594.8" y="250" width="134" height="58" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="661.8" y="276.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">gateway_controller</text><text x="661.8" y="294.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">launcher cards</text><rect x="736.0" y="250" width="134" height="58" rx="6" fill="#fff" stroke="#317f83" stroke-width="1.5"/><text x="803.0" y="276.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#172733">HtmlTree</text><text x="803.0" y="294.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">optional publisher</text><rect x="30" y="338" width="408" height="74" rx="6" fill="#fff3d6" stroke="#d7a555" stroke-width="1.5"/><text x="234.0" y="372.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">YOUR APPLICATIONS</text><text x="234.0" y="390.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">own TV_ dictionaries, own data, own callbacks</text><rect x="462" y="338" width="408" height="74" rx="6" fill="#fff" stroke="#d8cbb8" stroke-width="1.5"/><text x="666.0" y="372.0" text-anchor="middle" font-size="14" font-weight="700" fill="#172733">STORES BESIDE THE PROGRAM</text><text x="666.0" y="390.0" text-anchor="middle" font-size="11.5" fill="#172733" opacity=".85">app.json  |  gateway.json  |  app.en.txt  |  MongoDB</text><line x1="234" y1="338" x2="234" y2="312" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><line x1="666" y1="338" x2="666" y2="312" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><line x1="450" y1="214" x2="450" y2="166" stroke="#0d1e2b" stroke-width="1.8" marker-end="url(#a)"/><text x="30" y="440" font-size="12.5" fill="#52616a" text-anchor="start" font-weight="400" font-style="italic">Rule of thumb: arrows point from the thing that knows less to the thing that knows more. Apps call the library; the library never imports an app.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>